<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>课题组科研进度</title>
<style>
/* 布局：手机优先。顶部是姓名 + 访问码登录条；登录后先看「我的进度」，下面是全组近 8 周完成度台账 */
:root {
  --paper: #f3f6f6; --surface: #ffffff; --sunk: #e9efef; --ink: #142629; --ink-2: #4d6266; --ink-3: #7d8f92; --rule: #d3dedf;
  --accent: #1d6b75; --accent-ink: #ffffff; --accent-soft: #dfeeef;
  --lead: #2a64a8; --lead-soft: #e3ecf8; --ok: #2c7a50; --ok-soft: #e2f1e8; --warn: #a8690f; --warn-soft: #f8eedb;
  --bad: #b8322f; --bad-soft: #f8e3e2; --none: #7d8f92; --none-soft: #eaefef; --fix: #c0661d;
  --display: "Songti SC", "STSong", "Noto Serif CJK SC", "Source Han Serif SC", "SimSun", serif;
  --body: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root {
  --paper: #0f191b; --surface: #162326; --sunk: #1c2c30; --ink: #e2ebec; --ink-2: #a3b5b8; --ink-3: #74888c; --rule: #2a3c40;
  --accent: #5fb3bd; --accent-ink: #0f191b; --accent-soft: #183a3f;
  --lead: #7fb0ec; --lead-soft: #1b2c42; --ok: #6cc596; --ok-soft: #173326; --warn: #e2ad5a; --warn-soft: #3a2c14;
  --bad: #ef8a86; --bad-soft: #3d1d1c; --none: #8a9da0; --none-soft: #233236; --fix: #eb9a5a; color-scheme: dark; } }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.6;
  padding: max(20px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(40px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.wrap { max-width: 920px; margin: 0 auto; display: grid; gap: 18px; }
h1, h2, h3 { font-family: var(--display); margin: 0; text-wrap: balance; }
h1 { font-size: 23px; } h2 { font-size: 18px; } h3 { font-size: 15px; }
.faint { color: var(--ink-3); font-size: 13px; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
header { display: grid; gap: 4px; padding-bottom: 12px; border-bottom: 1px solid var(--rule); }
.card { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 16px; display: grid; gap: 12px; min-width: 0; }
form.login { display: grid; grid-template-columns: 1fr 1fr auto; gap: 10px; align-items: end; }
label { display: grid; gap: 4px; font-size: 13px; color: var(--ink-2); }
input { font: inherit; font-size: 16px; padding: 9px 11px; border: 1px solid var(--rule); border-radius: 8px; background: var(--paper); color: var(--ink); width: 100%; min-width: 0; }
button { font: inherit; font-size: 15px; border: 0; border-radius: 8px; padding: 10px 18px; background: var(--accent); color: var(--accent-ink); cursor: pointer; }
button.link { background: none; color: var(--accent); padding: 0; font-size: 13px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.msg { font-size: 14px; color: var(--bad); }
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; padding: 1px 10px; border-radius: 999px; white-space: nowrap; font-weight: 500; }
.chip::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.lead { color: var(--lead); background: var(--lead-soft); } .ok { color: var(--ok); background: var(--ok-soft); }
.warn { color: var(--warn); background: var(--warn-soft); } .bad { color: var(--bad); background: var(--bad-soft); }
.none { color: var(--none); background: var(--none-soft); }
.track { display: grid; grid-template-columns: repeat(7, 1fr); position: relative; }
.track::before { content: ""; position: absolute; left: 7%; right: 7%; top: 6px; height: 2px; background: var(--rule); }
.stage { display: grid; justify-items: center; gap: 4px; position: relative; min-width: 0; }
.dot { width: 14px; height: 14px; border-radius: 50%; background: var(--surface); border: 2px solid var(--rule); z-index: 1; }
.past .dot { background: var(--accent); border-color: var(--accent); }
.now .dot { border: 4px solid var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.lbl { font-size: 11.5px; color: var(--ink-3); text-align: center; line-height: 1.25; }
.now .lbl { color: var(--ink); font-weight: 600; }
.flag { font-size: 11px; color: var(--fix); text-align: center; line-height: 1.2; }
.weekrow { display: grid; gap: 8px; padding-top: 12px; border-top: 1px solid var(--rule); }
.weekrow:first-of-type { border-top: 0; padding-top: 0; }
.wk-head { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; }
ul.plans { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
ul.plans li { display: grid; grid-template-columns: auto 1fr; gap: 8px; align-items: start; font-size: 14px; }
ul.plans .why { grid-column: 2; color: var(--ink-3); font-size: 12.5px; }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
th, td { padding: 8px 8px; border-bottom: 1px solid var(--rule); text-align: left; vertical-align: middle; white-space: nowrap; }
th { font-weight: 500; color: var(--ink-3); font-size: 12px; }
td.cellw { text-align: center; padding: 6px 3px; }
.sq { display: inline-block; width: 20px; height: 20px; border-radius: 4px; background: var(--sunk); }
.sq.lead { background: var(--lead); } .sq.ok { background: var(--ok); } .sq.warn { background: var(--warn); } .sq.bad { background: var(--bad); } .sq.none { background: var(--none); opacity: .5; }
tr.me td { background: var(--accent-soft); }
tr.pick { cursor: pointer; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; color: var(--ink-2); }
.legend i { display: inline-block; width: 11px; height: 11px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; }
.note { font-size: 13px; color: var(--ink-2); }
[hidden] { display: none !important; }
@media (max-width: 560px) { form.login { grid-template-columns: 1fr 1fr; } form.login button { grid-column: 1 / -1; } .lbl { font-size: 10.5px; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>课题组科研进度</h1>
    <div class="faint" id="sub">输入你的姓名和团队访问码查看。</div>
  </header>

  <form class="card login" id="login" autocomplete="on" method="post" action="#" onsubmit="return false">
    <label for="name">姓名<input id="name" name="name" required placeholder="如：王姝"></label>
    <label for="code">团队访问码<input id="code" name="code" required placeholder="见首封说明邮件" autocapitalize="off" spellcheck="false"></label>
    <button type="submit" id="go">查看</button>
    <div class="msg" id="msg" hidden style="grid-column:1/-1"></div>
  </form>

  <section id="me" hidden></section>
  <section id="team" hidden></section>

  <p class="note">完成度由系统对照你上周周报里的「下周计划」逐条核对得出：领先、达到预期、落后预期、完全没做。连续两周没有发周报的成员会暂时从列表中移出（数据全部保留），重新发周报后自动恢复。</p>
</div>

<script>
(() => {
const RCLASS = { "领先": "lead", "达到预期": "ok", "落后预期": "warn", "完全没做": "bad", "首周(无上周计划)": "none" };
const PCLASS = { "完成": "ok", "超额完成": "lead", "部分完成": "warn", "未做": "bad" };
const STAGES = ["明确科学问题", "预实验", "核心实验", "拓展实验", "收敛", "画图", "成稿"];
let DATA = null, ME = null;

const $ = s => document.querySelector(s);
function el(tag, attrs, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") n.className = v; else if (k === "text") n.textContent = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v); else n.setAttribute(k, v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) n.append(c instanceof Node ? c : document.createTextNode(String(c)));
  return n;
}
function store(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (_) {} }
function load(k) { try { return localStorage.getItem(k) || ""; } catch (_) { return ""; } }
function b64(s) { const b = atob(s); const u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
function chip(r) { return r ? el("span", { class: "chip " + (RCLASS[r] || "none"), text: r }) : el("span", { class: "chip none", text: "未交" }); }
function stageIdx(s) {
  if (!s) return 0; if (s.startsWith("明确") || s === "重找科学问题") return 0;
  if (s === "预实验" || s === "修正中") return 1; if (s === "核心实验") return 2; if (s.startsWith("拓展实验")) return 3;
  return Math.max(0, ["收敛", "画图", "成稿"].indexOf(s) + 4);
}

async function decrypt(code) {
  const res = await fetch("data.json?t=" + Date.now(), { cache: "no-store" });
  if (!res.ok) throw new Error("数据文件读取失败（" + res.status + "），请稍后再试。");
  const env = await res.json();
  if (!window.crypto || !crypto.subtle) throw new Error("你的浏览器不支持解密，请换用新版 Chrome / Edge / Safari / 微信内置浏览器。");
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(code.trim()), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(env.salt), iterations: env.iter, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  try {
    const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(env.iv) }, key, b64(env.ct));
    return JSON.parse(new TextDecoder().decode(pt));
  } catch (_) { throw new Error("团队访问码不对，请核对首封说明邮件里的访问码。"); }
}

function track(m) {
  const cur = stageIdx(m.stage);
  return el("div", { class: "track", "aria-label": "当前阶段：" + (m.stage || "未填") }, STAGES.map((s, i) => {
    let flag = null;
    if (i === 1 && (m.stage === "修正中" || m.fixes > 0)) flag = "修正 " + m.fixes + " 次";
    if (i === 0 && m.stage === "重找科学问题") flag = "重找中";
    if (i === 3 && i === cur && (m.stage || "").includes("-")) flag = m.stage.split("-")[1];
    return el("div", { class: "stage " + (i < cur ? "past" : i === cur ? "now" : "") }, el("span", { class: "dot" }), el("span", { class: "lbl", text: s }), flag ? el("span", { class: "flag", text: flag }) : null);
  }));
}

function renderPerson(m, isMe) {
  const box = $("#me"); box.hidden = false;
  const thisWeek = m.ratings[DATA.week];
  box.replaceChildren(el("div", { class: "card" },
    el("div", { class: "wk-head" }, el("h2", { text: (isMe ? "我的进度 · " : "") + m.name }), el("span", { class: "faint", text: m.grade }),
      !isMe ? el("button", { class: "link", type: "button", onclick: () => renderPerson(ME, true), text: "← 回到我的进度" }) : null),
    m.question ? el("div", { class: "note", text: "科学问题：" + m.question }) : null,
    track(m),
    el("div", { class: "wk-head" }, el("span", { text: "本周（" + DATA.week + "）：" }), m.lastWeek === DATA.week ? chip(thisWeek || "首周(无上周计划)") : el("span", { class: "chip none", text: "本周还没交" })),
  ), el("div", { class: "card" }, el("h3", { text: "每周完成情况" }),
    m.history.length ? m.history.map(h => el("div", { class: "weekrow" },
      el("div", { class: "wk-head" }, el("strong", { class: "mono", text: h.week }), chip(h.rating), h.approval ? el("span", { class: "faint", text: "导师审批：" + h.approval }) : null, h.stage ? el("span", { class: "faint", text: "阶段：" + h.stage }) : null),
      h.ratingNote ? el("div", { class: "note", text: h.ratingNote }) : null,
      h.checked.length ? el("div", {}, el("div", { class: "faint", text: "上周计划核对" }), el("ul", { class: "plans" }, h.checked.map(p => el("li", {}, el("span", { class: "chip " + (PCLASS[p.result] || "none"), text: p.result || "待核对" }), el("span", { text: p.text }), p.note ? el("span", { class: "why", text: p.note }) : null)))) : null,
      h.next.length ? el("div", {}, el("div", { class: "faint", text: "下周计划" }), el("ul", { class: "plans" }, h.next.map((t, i) => el("li", {}, el("span", { class: "mono faint", text: (i + 1) + "." }), el("span", { text: t }))))) : null,
    )) : el("p", { class: "faint", text: "还没有周报记录。" })));
  box.scrollIntoView({ behavior: "smooth", block: "start" });
}

function renderTeam() {
  const box = $("#team"); box.hidden = false;
  const legend = el("div", { class: "legend" }, ["领先", "达到预期", "落后预期", "完全没做"].map(r => el("span", {}, el("i", { class: "sq " + RCLASS[r], style: "width:11px;height:11px" }), r)), el("span", {}, el("i", { class: "sq", style: "width:11px;height:11px" }), "未交"));
  box.replaceChildren(el("div", { class: "card" }, el("h2", { text: "全组完成情况" }), legend,
    el("div", { class: "tablewrap" }, el("table", {},
      el("thead", {}, el("tr", {}, el("th", { text: "成员" }), el("th", { text: "当前阶段" }), DATA.weeks.map(w => el("th", { class: "mono", style: "text-align:center", text: w.slice(6) })))),
      el("tbody", {}, DATA.members.map(m => el("tr", { class: "pick" + (ME && m.name === ME.name ? " me" : ""), onclick: () => renderPerson(m, ME && m.name === ME.name) },
        el("td", {}, el("strong", { text: m.name }), " ", el("span", { class: "faint", text: m.grade })),
        el("td", { text: m.stage || "—" }),
        DATA.weeks.map(w => { const r = m.ratings[w]; return el("td", { class: "cellw", title: w + "：" + (r || "未交") }, el("span", { class: "sq " + (r ? RCLASS[r] || "none" : "") })); })))))),
    el("div", { class: "faint", text: "表头数字是周次（如 48 = " + DATA.week.slice(0, 4) + " 年第 48 周）。点任意一行查看这位成员的每周核对详情。" })));
}

$("#login").addEventListener("submit", async e => {
  e.preventDefault();
  const name = $("#name").value.trim(), code = $("#code").value.trim();
  const msg = $("#msg"); msg.hidden = true; $("#go").disabled = true; $("#go").textContent = "正在解密…";
  try {
    DATA = await decrypt(code);
    ME = DATA.members.find(m => m.name === name) || null;
    store("lp_name", name); store("lp_code", code);
    $("#sub").textContent = "数据更新于 " + DATA.generated + " · 本周 " + DATA.week;
    renderTeam();
    if (ME) renderPerson(ME, true);
    else { $("#me").hidden = false; $("#me").replaceChildren(el("div", { class: "card" }, el("div", { class: "msg", text: "进度列表里没有「" + name + "」。请检查姓名是否与登记一致；如果你已经两周没发周报，发送新周报后会自动恢复。" }))); }
  } catch (err) { msg.textContent = err.message || String(err); msg.hidden = false; }
  $("#go").disabled = false; $("#go").textContent = "查看";
});
const n0 = load("lp_name"), c0 = load("lp_code");
if (n0) $("#name").value = n0; if (c0) $("#code").value = c0;
if (n0 && c0) $("#go").click();
})();
</script>
</body>
</html>
